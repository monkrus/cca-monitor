<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCA Monitor</title>
<style>
  :root {
    --bg: #0a0e17;
    --surface: #111827;
    --border: #1e293b;
    --text: #e2e8f0;
    --muted: #64748b;
    --accent: #6366f1;
    --green: #22c55e;
    --red: #ef4444;
    --amber: #f59e0b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .header {
    border-bottom: 1px solid var(--border);
    padding: 24px 32px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .header h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
  .header h1 span { color: var(--accent); }
  .header-meta { font-size: 13px; color: var(--muted); }

  .stats-row {
    display: flex; gap: 16px; padding: 24px 32px; flex-wrap: wrap;
  }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px 20px; min-width: 140px; flex: 1;
  }
  .stat-card .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .stat-card .value { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat-card .value.green { color: var(--green); }
  .stat-card .value.amber { color: var(--amber); }
  .stat-card .sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

  .charts-row {
    display: flex; gap: 16px; padding: 0 32px 24px; flex-wrap: wrap;
  }
  .chart-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 20px; flex: 1; min-width: 300px;
  }
  .chart-card h3 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 16px; }
  .bar-chart { display: flex; align-items: flex-end; gap: 12px; height: 160px; padding-top: 8px; }
  .bar-group { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
  .bar-wrapper { display: flex; gap: 4px; align-items: flex-end; width: 100%; justify-content: center; flex: 1; }
  .bar {
    border-radius: 4px 4px 0 0; min-width: 20px; transition: height 0.5s ease;
    position: relative; cursor: default;
  }
  .bar:hover { opacity: 0.85; }
  .bar-label { font-size: 11px; color: var(--muted); text-align: center; white-space: nowrap; }
  .bar-value { font-size: 10px; font-weight: 600; color: var(--text); text-align: center; margin-bottom: 2px; }
  .chart-legend { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; }

  .chord-container { display: flex; justify-content: center; align-items: center; }
  .chord-container canvas { max-width: 100%; height: auto; }

  /* Price performance sparkline area */
  .price-row { display: flex; gap: 16px; padding: 0 32px 24px; flex-wrap: wrap; }
  .price-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px 20px; flex: 1; min-width: 200px;
  }
  .price-card .price-token { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .price-card .price-usd { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .price-card .price-change { font-size: 13px; font-weight: 600; margin-left: 8px; }
  .price-card .price-change.up { color: var(--green); }
  .price-card .price-change.down { color: var(--red); }
  .price-card .price-meta { font-size: 11px; color: var(--muted); margin-top: 4px; }

  .table-wrap { padding: 0 32px 32px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .table-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
  .table-header h2 { font-size: 15px; font-weight: 600; }
  .table-controls { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-bar {
    display: flex; gap: 8px; padding: 0 32px 16px; flex-wrap: wrap; align-items: center;
  }
  .filter-bar input, .filter-bar select {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 6px 12px; border-radius: 6px; font-size: 12px; font-family: inherit;
    transition: border-color 0.15s;
  }
  .filter-bar input:focus, .filter-bar select:focus { outline: none; border-color: var(--accent); }
  .filter-bar input { min-width: 180px; }
  .filter-bar select { cursor: pointer; }
  .filter-bar .filter-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .toggle-btn, .export-btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--muted);
    padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer;
    transition: all 0.15s; white-space: nowrap;
  }
  .toggle-btn:hover, .export-btn:hover { border-color: var(--accent); color: var(--text); }
  .toggle-btn.active { border-color: var(--accent); color: var(--accent); }
  .export-btn { display: inline-flex; align-items: center; gap: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead th {
    text-align: left; padding: 10px 12px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted);
    border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg);
    cursor: pointer; user-select: none;
  }
  thead th:hover { color: var(--text); }
  thead th .sort-arrow { font-size: 10px; margin-left: 4px; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.15s; }
  tbody tr.data-row { cursor: pointer; }
  tbody tr.data-row:hover { background: rgba(99,102,241,0.05); }
  tbody tr.test-row { opacity: 0.5; }
  td { padding: 12px; white-space: nowrap; }
  td.wrap { white-space: normal; max-width: 200px; }

  /* Detail panel (drill-down) */
  .detail-row td { padding: 0; border-bottom: 1px solid var(--border); }
  .detail-panel {
    background: var(--surface); padding: 20px 24px; margin: 0;
    border-top: 2px solid var(--accent);
    animation: slideDown 0.2s ease-out;
  }
  @keyframes slideDown { from { opacity: 0; max-height: 0; } to { opacity: 1; max-height: 600px; } }
  .detail-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px; margin-bottom: 16px;
  }
  .detail-item .detail-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
  .detail-item .detail-value { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .detail-item .detail-value.green { color: var(--green); }
  .detail-item .detail-value.red { color: var(--red); }
  .detail-item .detail-value.amber { color: var(--amber); }
  .detail-conc {
    display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
    margin-top: 8px; padding-top: 12px; border-top: 1px solid var(--border);
  }
  .conc-bar-wrap { flex: 1; min-width: 180px; }
  .conc-bar-bg { height: 8px; background: rgba(255,255,255,0.06); border-radius: 4px; overflow: hidden; }
  .conc-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
  .conc-bar-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; display: flex; justify-content: space-between; }
  .detail-flags { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  .detail-flag { background: rgba(245,158,11,0.12); color: var(--amber); padding: 3px 10px; border-radius: 4px; font-size: 12px; }
  .detail-links { margin-top: 12px; display: flex; gap: 12px; flex-wrap: wrap; }
  .detail-links a { font-size: 13px; }

  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 9999px;
    font-size: 11px; font-weight: 600;
  }
  .badge-green { background: rgba(34,197,94,0.15); color: var(--green); }
  .badge-red { background: rgba(239,68,68,0.15); color: var(--red); }
  .badge-chain { background: rgba(99,102,241,0.15); color: var(--accent); }
  .badge-flag { background: rgba(245,158,11,0.12); color: var(--amber); margin: 2px 0; display: inline-block; }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .mono { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px; color: var(--muted); }
  .right { text-align: right; }

  .cta-bar {
    background: linear-gradient(135deg, rgba(99,102,241,0.12), rgba(139,92,246,0.08));
    border: 1px solid rgba(99,102,241,0.25); border-radius: 8px;
    padding: 16px 24px; margin: 0 32px 24px; display: flex;
    align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  .cta-bar .cta-text { font-size: 14px; }
  .cta-bar .cta-text strong { color: #a5b4fc; }
  .cta-btn {
    background: var(--accent); color: white; border: none; padding: 8px 20px;
    border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;
    text-decoration: none; display: inline-block;
  }
  .cta-btn:hover { background: #4f46e5; text-decoration: none; }

  .empty-state { text-align: center; padding: 80px 32px; color: var(--muted); }
  .empty-state h2 { font-size: 18px; margin-bottom: 8px; color: var(--text); }

  /* ── Mobile ───────────────────────────────────────────────────── */
  @media (max-width: 768px) {
    .header { padding: 16px; flex-direction: column; gap: 8px; align-items: flex-start; }
    .header-meta { font-size: 12px; }
    .stats-row { padding: 12px 16px; gap: 8px; }
    .stat-card { min-width: 0; flex-basis: calc(50% - 4px); padding: 12px; }
    .stat-card .value { font-size: 18px; }
    .stat-card .sub { font-size: 10px; }
    .charts-row { padding: 0 16px 16px; flex-direction: column; }
    .chart-card { min-width: unset; padding: 16px; }
    .bar-chart { gap: 6px; height: 120px; }
    .bar-label { font-size: 9px; }
    .cta-bar { margin: 0 16px 16px; padding: 12px 16px; flex-direction: column; text-align: center; }
    .price-row { padding: 0 16px 16px; }
    .price-card { min-width: 0; flex-basis: calc(50% - 8px); }
    .filter-bar { padding: 0 16px 12px; }
    .filter-bar input { min-width: 120px; flex: 1; }
    .table-wrap { padding: 0 16px 32px; }
    .table-header { flex-direction: column; align-items: flex-start; }
    table { font-size: 12px; }
    thead th { padding: 8px 6px; font-size: 10px; }
    td { padding: 8px 6px; }
    /* Hide less critical columns on mobile */
    .hide-mobile { display: none; }
    .detail-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .detail-panel { padding: 14px 16px; }
  }
  @media (max-width: 480px) {
    .stat-card { flex-basis: 100%; }
    .detail-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="header">
  <h1><span>CCA</span> Monitor</h1>
  <div class="header-meta" id="meta">Loading...</div>
</div>

<div class="stats-row" id="stats"></div>

<div class="charts-row" id="charts"></div>

<div class="cta-bar">
  <div class="cta-text">Get <strong>instant alerts</strong> when new auctions deploy, with bid tracking and analysis.</div>
  <a href="https://t.me/cca_auctions" class="cta-btn" target="_blank">Join Telegram Channel</a>
</div>

<div class="price-row" id="priceRow"></div>

<div class="filter-bar">
  <span class="filter-label">Filter:</span>
  <input type="text" id="searchInput" placeholder="Search token name..." oninput="applyFilters()">
  <select id="chainFilter" onchange="applyFilters()">
    <option value="">All chains</option>
    <option value="mainnet">Mainnet</option>
    <option value="base">Base</option>
    <option value="arbitrum">Arbitrum</option>
    <option value="unichain">Unichain</option>
  </select>
  <select id="statusFilter" onchange="applyFilters()">
    <option value="">All status</option>
    <option value="graduated">Graduated</option>
    <option value="failed">Failed</option>
  </select>
  <select id="hookFilter" onchange="applyFilters()">
    <option value="">Any hook</option>
    <option value="yes">With hook</option>
    <option value="no">No hook</option>
  </select>
</div>

<div class="table-wrap">
  <div class="table-header">
    <h2>Auctions <span id="filterCount" style="font-size:12px;color:var(--muted);font-weight:400;"></span></h2>
    <div class="table-controls">
      <button class="export-btn" onclick="exportJSON()" title="Download full dataset as JSON">JSON</button>
      <button class="export-btn" onclick="exportCSV()" title="Download auction table as CSV">CSV</button>
      <button class="toggle-btn" id="testToggle" onclick="toggleTests()">Show test auctions</button>
    </div>
  </div>
  <table>
    <thead>
      <tr id="thead-row">
        <th data-key="name">Token <span class="sort-arrow"></span></th>
        <th data-key="chain">Chain <span class="sort-arrow"></span></th>
        <th data-key="graduated">Status <span class="sort-arrow"></span></th>
        <th data-key="currencySymbol" class="hide-mobile">Currency <span class="sort-arrow"></span></th>
        <th data-key="raised" class="right">Raised <span class="sort-arrow"></span></th>
        <th data-key="totalBids" class="right hide-mobile">Bids <span class="sort-arrow"></span></th>
        <th data-key="uniqueBidders" class="right">Bidders <span class="sort-arrow"></span></th>
        <th data-key="durationHours" class="right hide-mobile">Duration <span class="sort-arrow"></span></th>
        <th data-key="clearingVsFloor" class="right">Clear/Floor <span class="sort-arrow"></span></th>
        <th data-key="hhi" class="right hide-mobile">HHI <span class="sort-arrow"></span></th>
        <th data-key="top5Pct" class="right hide-mobile">Top-5% <span class="sort-arrow"></span></th>
        <th data-key="hasValidationHook" class="hide-mobile">Hook <span class="sort-arrow"></span></th>
        <th class="wrap hide-mobile">Flags</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty-state" id="empty" style="display:none">
    <h2>No auctions found</h2>
    <p>Run <code>npm run analyze</code> to pull auction data.</p>
  </div>
</div>

<script>
var allData = null;
var showTests = false;
var sortKey = null;
var sortAsc = true;
var expandedRow = null;
var filterSearch = '';
var filterChain = '';
var filterStatus = '';
var filterHook = '';

async function load() {
  try {
    var urls = [
      'results.json',
      'https://raw.githubusercontent.com/monkrus/cca-monitor/master/data/results.json',
    ];
    var data;
    for (var i = 0; i < urls.length; i++) {
      try {
        var resp = await fetch(urls[i]);
        if (resp.ok) { data = await resp.json(); break; }
      } catch (e) {}
    }
    if (!data) throw new Error('No data');
    allData = data;
    render(data);
  } catch (e) {
    document.getElementById('empty').style.display = 'block';
  }
}

function toggleTests() {
  showTests = !showTests;
  var btn = document.getElementById('testToggle');
  btn.textContent = showTests ? 'Hide test auctions' : 'Show test auctions';
  btn.classList.toggle('active', showTests);
  expandedRow = null;
  if (allData) renderTable(allData);
}

function applyFilters() {
  filterSearch = (document.getElementById('searchInput').value || '').toLowerCase();
  filterChain = document.getElementById('chainFilter').value;
  filterStatus = document.getElementById('statusFilter').value;
  filterHook = document.getElementById('hookFilter').value;
  expandedRow = null;
  if (allData) renderTable(allData);
}

function matchesFilters(a) {
  if (filterSearch) {
    var haystack = ((a.name || '') + ' ' + (a.tokenSymbol || '') + ' ' + (a.tokenName || '')).toLowerCase();
    if (haystack.indexOf(filterSearch) < 0) return false;
  }
  if (filterChain && a.chain !== filterChain) return false;
  if (filterStatus === 'graduated' && !a.graduated) return false;
  if (filterStatus === 'failed' && a.graduated !== false) return false;
  if (filterHook === 'yes' && !a.hasValidationHook) return false;
  if (filterHook === 'no' && a.hasValidationHook) return false;
  return true;
}

function render(data) {
  var date = new Date(data.timestamp);
  var real = data.auctions.filter(function(a) { return !a.isTest; });
  document.getElementById('meta').textContent = 'Last updated: ' + date.toLocaleString() + ' | ' + real.length + ' real auctions, ' + data.summary.tests + ' test';

  var s = data.summary;
  var bi = s.bidderInsights || {};
  var statsHtml = [
    { label: 'Real Auctions', value: s.real, cls: '' },
    { label: 'Graduated', value: s.graduated, cls: 'green', sub: 'of ' + s.total + ' total' },
    { label: 'Unique Bidders', value: bi.totalUnique ? bi.totalUnique.toLocaleString() : '?', cls: '', sub: bi.repeatBidders ? bi.repeatBidders + ' repeat (' + bi.recurrenceRate + ')' : '' },
    { label: 'With KYC Hook', value: s.withHooks, cls: '', sub: 'of ' + s.real + ' real' },
  ].map(function(s) {
    return '<div class="stat-card"><div class="label">' + s.label + '</div><div class="value ' + s.cls + '">' + s.value + '</div>' + (s.sub ? '<div class="sub">' + s.sub + '</div>' : '') + '</div>';
  }).join('');
  document.getElementById('stats').innerHTML = statsHtml;

  renderPriceRow(data);
  renderCharts(data);
  renderTable(data);

  document.querySelectorAll('#thead-row th[data-key]').forEach(function(th) {
    th.addEventListener('click', function() {
      var key = th.getAttribute('data-key');
      if (sortKey === key) { sortAsc = !sortAsc; }
      else { sortKey = key; sortAsc = true; }
      expandedRow = null;
      renderTable(allData);
    });
  });
}

function renderPriceRow(data) {
  var real = data.auctions.filter(function(a) { return !a.isTest && a.graduated && a.currentPriceUsd; });
  if (real.length === 0) {
    document.getElementById('priceRow').innerHTML = '';
    return;
  }
  document.getElementById('priceRow').innerHTML = real.map(function(a) {
    var price = parseFloat(a.currentPriceUsd);
    var change = parseFloat(a.priceChange24h || '0');
    var changeCls = change >= 0 ? 'up' : 'down';
    var changeStr = (change >= 0 ? '+' : '') + change.toFixed(1) + '%';
    var vol = a.volume24h ? '$' + parseFloat(a.volume24h).toLocaleString('en-US', {maximumFractionDigits: 0}) : '';
    var when = a.priceSnapshotAt ? new Date(a.priceSnapshotAt).toLocaleString() : '';
    return '<div class="price-card">' +
      '<div class="price-token">' + (a.tokenSymbol || a.name) + '</div>' +
      '<span class="price-usd">$' + price.toFixed(6) + '</span>' +
      '<span class="price-change ' + changeCls + '">' + changeStr + ' 24h</span>' +
      (vol ? '<div class="price-meta">Vol: ' + vol + '</div>' : '') +
      (when ? '<div class="price-meta">Snapshot: ' + when + '</div>' : '') +
      '</div>';
  }).join('');
}

function renderCharts(data) {
  var real = data.auctions.filter(function(a) { return !a.isTest; });
  if (real.length === 0) return;

  var maxRatio = 0;
  var maxBids = 0;
  real.forEach(function(a) {
    var r = parseFloat(a.clearingVsFloor) || 0;
    if (r > maxRatio) maxRatio = r;
    var m = Math.max(a.totalBids || 0, a.uniqueBidders || 0);
    if (m > maxBids) maxBids = m;
  });

  var chart1Bars = real.map(function(a) {
    var ratio = parseFloat(a.clearingVsFloor) || 0;
    var h = maxRatio > 0 ? Math.max(4, (ratio / maxRatio) * 140) : 4;
    var label = ratio > 0 ? ratio.toFixed(0) + '%' : 'n/a';
    return '<div class="bar-group">' +
      '<div class="bar-wrapper"><div class="bar" style="height:' + h + 'px;background:var(--accent);width:32px;" title="' + label + '"><div class="bar-value" style="position:absolute;top:-18px;width:100%;text-align:center;">' + label + '</div></div></div>' +
      '<div class="bar-label">' + a.name + '</div></div>';
  }).join('');

  var chart2Bars = real.map(function(a) {
    var bids = a.totalBids || 0;
    var bidders = a.uniqueBidders || 0;
    var hBids = maxBids > 0 ? Math.max(4, (bids / maxBids) * 140) : 4;
    var hBidders = maxBids > 0 ? Math.max(4, (bidders / maxBids) * 140) : 4;
    return '<div class="bar-group">' +
      '<div class="bar-wrapper">' +
      '<div class="bar" style="height:' + hBids + 'px;background:var(--accent);width:20px;" title="' + bids.toLocaleString() + ' bids"></div>' +
      '<div class="bar" style="height:' + hBidders + 'px;background:var(--green);width:20px;" title="' + bidders.toLocaleString() + ' bidders"></div>' +
      '</div>' +
      '<div class="bar-label">' + a.name + '</div></div>';
  }).join('');

  // Concentration chart
  var concAuctions = real.filter(function(a) { return a.concentration; });
  var chart3Html = '';
  if (concAuctions.length > 0) {
    var maxHhi = 10000;
    var chart3Bars = concAuctions.map(function(a) {
      var c = a.concentration;
      var hHhi = Math.max(4, (c.hhi / maxHhi) * 140);
      var hLate = Math.max(4, (c.lateBidPct / 100) * 140);
      var hhiColor = c.hhi < 1500 ? 'var(--green)' : c.hhi < 2500 ? 'var(--amber)' : 'var(--red)';
      return '<div class="bar-group">' +
        '<div class="bar-wrapper">' +
        '<div class="bar" style="height:' + hHhi + 'px;background:' + hhiColor + ';width:20px;" title="HHI: ' + c.hhi + (c.effectiveCompetition ? ' (competitive)' : ' (concentrated)') + '"><div class="bar-value" style="position:absolute;top:-18px;width:100%;text-align:center;">' + c.hhi + '</div></div>' +
        '<div class="bar" style="height:' + hLate + 'px;background:var(--accent);width:20px;" title="Late bids: ' + c.lateBidPct + '%"></div>' +
        '</div>' +
        '<div class="bar-label">' + a.name + '</div></div>';
    }).join('');
    chart3Html = '<div class="chart-card"><h3>Concentration & Late Bids</h3><div class="bar-chart" style="position:relative;">' + chart3Bars + '</div>' +
      '<div class="chart-legend">' +
      '<div class="legend-item"><div class="legend-dot" style="background:var(--green);"></div>HHI &lt;1500</div>' +
      '<div class="legend-item"><div class="legend-dot" style="background:var(--amber);"></div>HHI 1500-2500</div>' +
      '<div class="legend-item"><div class="legend-dot" style="background:var(--red);"></div>HHI &gt;2500</div>' +
      '<div class="legend-item"><div class="legend-dot" style="background:var(--accent);"></div>Late-bid %</div>' +
      '</div></div>';
  }

  // Chord diagram for bidder overlap
  var chordHtml = '';
  var om = data.summary.overlapMatrix;
  if (om) {
    var names = Object.keys(om);
    if (names.length >= 2) {
      chordHtml = '<div class="chart-card"><h3>Cross-Auction Bidder Flow</h3>' +
        '<div class="chord-container"><canvas id="chordCanvas" width="320" height="320"></canvas></div>' +
        '<div class="chart-legend" id="chordLegend"></div></div>';
    }
  }

  document.getElementById('charts').innerHTML =
    '<div class="chart-card"><h3>Clearing vs Floor Price</h3><div class="bar-chart" style="position:relative;">' + chart1Bars + '</div></div>' +
    '<div class="chart-card"><h3>Bids & Unique Bidders</h3><div class="bar-chart" style="position:relative;">' + chart2Bars + '</div>' +
    '<div class="chart-legend"><div class="legend-item"><div class="legend-dot" style="background:var(--accent);"></div>Total bids</div><div class="legend-item"><div class="legend-dot" style="background:var(--green);"></div>Unique bidders</div></div></div>' +
    chart3Html + chordHtml;

  if (om) drawChord(om, data.auctions);
}

function drawChord(overlapMatrix, auctions) {
  var canvas = document.getElementById('chordCanvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var names = Object.keys(overlapMatrix);
  var n = names.length;
  if (n < 2) return;

  var W = canvas.width, H = canvas.height;
  var cx = W / 2, cy = H / 2, R = Math.min(W, H) / 2 - 40;

  var colors = ['#6366f1', '#22c55e', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4'];

  // Get bidder counts per auction for arc sizing
  var auctionMap = {};
  auctions.forEach(function(a) { if (!a.isTest) auctionMap[a.name] = a; });
  var bidderCounts = names.map(function(name) { return (auctionMap[name] && auctionMap[name].uniqueBidders) || 1; });
  var totalBidders = bidderCounts.reduce(function(s, v) { return s + v; }, 0);

  // Compute arc angles proportional to bidder count
  var gap = 0.06;
  var totalGap = gap * n;
  var availableAngle = 2 * Math.PI - totalGap;
  var arcs = [];
  var angle = -Math.PI / 2;
  for (var i = 0; i < n; i++) {
    var sweep = (bidderCounts[i] / totalBidders) * availableAngle;
    arcs.push({ start: angle, end: angle + sweep, mid: angle + sweep / 2, color: colors[i % colors.length], name: names[i] });
    angle += sweep + gap;
  }

  ctx.clearRect(0, 0, W, H);

  // Draw arcs
  for (var i = 0; i < n; i++) {
    ctx.beginPath();
    ctx.arc(cx, cy, R, arcs[i].start, arcs[i].end);
    ctx.strokeStyle = arcs[i].color;
    ctx.lineWidth = 12;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  // Draw chords (connections)
  var maxOverlap = 0;
  for (var i = 0; i < n; i++)
    for (var j = i + 1; j < n; j++) {
      var v = overlapMatrix[names[i]][names[j]] || 0;
      if (v > maxOverlap) maxOverlap = v;
    }

  for (var i = 0; i < n; i++) {
    for (var j = i + 1; j < n; j++) {
      var v = overlapMatrix[names[i]][names[j]] || 0;
      if (v === 0) continue;
      var alpha = Math.max(0.15, Math.min(0.7, v / (maxOverlap || 1)));
      var thickness = Math.max(1, Math.min(6, (v / (maxOverlap || 1)) * 6));

      var x1 = cx + (R - 8) * Math.cos(arcs[i].mid);
      var y1 = cy + (R - 8) * Math.sin(arcs[i].mid);
      var x2 = cx + (R - 8) * Math.cos(arcs[j].mid);
      var y2 = cy + (R - 8) * Math.sin(arcs[j].mid);

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.quadraticCurveTo(cx * 0.6 + (x1 + x2) * 0.2, cy * 0.6 + (y1 + y2) * 0.2, x2, y2);
      ctx.strokeStyle = arcs[i].color.replace(')', ',' + alpha + ')').replace('rgb', 'rgba').replace('#', '');
      // Use hex to rgba
      var hex = arcs[i].color;
      var r = parseInt(hex.slice(1, 3), 16);
      var g = parseInt(hex.slice(3, 5), 16);
      var b = parseInt(hex.slice(5, 7), 16);
      ctx.strokeStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
      ctx.lineWidth = thickness;
      ctx.lineCap = 'round';
      ctx.stroke();

      // Label on the chord
      var mx = (x1 + x2) / 2 + (cx - (x1 + x2) / 2) * 0.3;
      var my = (y1 + y2) / 2 + (cy - (y1 + y2) / 2) * 0.3;
      ctx.fillStyle = 'rgba(226,232,240,0.8)';
      ctx.font = '600 10px Inter, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(v.toString(), mx, my);
    }
  }

  // Draw labels outside arcs
  ctx.fillStyle = '#e2e8f0';
  ctx.font = '600 12px Inter, system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (var i = 0; i < n; i++) {
    var lx = cx + (R + 24) * Math.cos(arcs[i].mid);
    var ly = cy + (R + 24) * Math.sin(arcs[i].mid);
    ctx.fillStyle = arcs[i].color;
    ctx.fillText(arcs[i].name, lx, ly);
  }

  // Legend
  var legendEl = document.getElementById('chordLegend');
  if (legendEl) {
    legendEl.innerHTML = names.map(function(name, i) {
      var count = bidderCounts[i];
      return '<div class="legend-item"><div class="legend-dot" style="background:' + arcs[i].color + ';"></div>' + name + ' (' + count.toLocaleString() + ')</div>';
    }).join('') + '<div class="legend-item" style="color:var(--muted);font-style:italic;">Lines = shared bidders</div>';
  }
}

function parseRaised(a) {
  if (!a.currencyRaisedFormatted) return 0;
  return parseFloat(a.currencyRaisedFormatted.replace(/[^0-9.]/g, '')) || 0;
}

function getSortValue(a, key) {
  switch(key) {
    case 'name': return (a.tokenSymbol || a.name || '').toLowerCase();
    case 'chain': return a.chain;
    case 'graduated': return a.graduated ? 1 : 0;
    case 'currencySymbol': return a.currencySymbol || '';
    case 'raised': return parseRaised(a);
    case 'totalBids': return a.totalBids || 0;
    case 'uniqueBidders': return a.uniqueBidders || 0;
    case 'durationHours': return a.durationHours || 0;
    case 'clearingVsFloor': return parseFloat(a.clearingVsFloor) || 0;
    case 'hhi': return a.concentration ? a.concentration.hhi : -1;
    case 'top5Pct': return a.concentration ? a.concentration.top5Pct : -1;
    case 'hasValidationHook': return a.hasValidationHook ? 1 : 0;
    default: return '';
  }
}

function toggleDetail(idx) {
  if (expandedRow === idx) { expandedRow = null; }
  else { expandedRow = idx; }
  renderTable(allData);
}

function buildDetailPanel(a) {
  var chainSlug = a.chain === 'mainnet' ? 'ethereum' : a.chain;
  var explorerBase = { mainnet: 'https://etherscan.io', base: 'https://basescan.org', arbitrum: 'https://arbiscan.io', unichain: 'https://uniscan.xyz' }[a.chain] || '';
  var uniswapUrl = 'https://app.uniswap.org/explore/auctions/' + chainSlug + '/' + a.tokenAddress;
  var explorerUrl = explorerBase + '/address/' + a.contractAddress;
  var tokenUrl = explorerBase + '/address/' + a.tokenAddress;

  var items = [
    { label: 'Token Name', value: a.tokenName || '?', cls: '' },
    { label: 'Token Supply', value: a.tokenSupply || '?', cls: '' },
    { label: 'Floor Price', value: a.floorPrice || '?', cls: '' },
    { label: 'Clearing Price', value: a.clearingPrice || '?', cls: '' },
    { label: 'Clearing/Floor', value: a.clearingVsFloor || '?', cls: '' },
    { label: 'Currency Raised', value: a.currencyRaisedFormatted || '?', cls: '' },
    { label: 'Total Bids', value: a.totalBids != null ? a.totalBids.toLocaleString() : '?', cls: '' },
    { label: 'Unique Bidders', value: a.uniqueBidders != null ? a.uniqueBidders.toLocaleString() : '?', cls: '' },
    { label: 'Repeat Bidders', value: a.repeatBidders != null ? a.repeatBidders.toString() : '?', cls: '' },
    { label: 'Duration', value: (a.durationHours / 24).toFixed(1) + ' days (' + a.durationHours + 'h)', cls: '' },
    { label: 'Blocks', value: (a.startBlock || '?') + ' - ' + (a.endBlock || '?'), cls: '' },
    { label: 'Tick Spacing', value: a.tickSpacingAsPctOfFloor || '?', cls: '' },
  ];

  // Add price data if available
  if (a.currentPriceUsd) {
    var change = parseFloat(a.priceChange24h || '0');
    var changeCls = change >= 0 ? 'green' : 'red';
    var changeStr = (change >= 0 ? '+' : '') + change.toFixed(1) + '%';
    items.push({ label: 'Current Price', value: '$' + parseFloat(a.currentPriceUsd).toFixed(6), cls: '' });
    items.push({ label: '24h Change', value: changeStr, cls: changeCls });
    if (a.volume24h) items.push({ label: '24h Volume', value: '$' + parseFloat(a.volume24h).toLocaleString('en-US', {maximumFractionDigits: 0}), cls: '' });
  }

  var gridHtml = items.map(function(item) {
    return '<div class="detail-item"><div class="detail-label">' + item.label + '</div><div class="detail-value ' + item.cls + '">' + item.value + '</div></div>';
  }).join('');

  // Concentration bars
  var concHtml = '';
  if (a.concentration) {
    var c = a.concentration;
    var hhiPct = Math.min(100, c.hhi / 100);
    var hhiColor = c.hhi < 1500 ? 'var(--green)' : c.hhi < 2500 ? 'var(--amber)' : 'var(--red)';
    var hhiLabel = c.effectiveCompetition ? 'Competitive' : 'Concentrated';
    concHtml = '<div class="detail-conc">' +
      '<div class="conc-bar-wrap"><div class="conc-bar-label"><span>HHI: ' + c.hhi + ' (' + hhiLabel + ')</span><span>/ 10,000</span></div><div class="conc-bar-bg"><div class="conc-bar-fill" style="width:' + hhiPct + '%;background:' + hhiColor + ';"></div></div></div>' +
      '<div class="conc-bar-wrap"><div class="conc-bar-label"><span>Top-5 Share</span><span>' + c.top5Pct + '%</span></div><div class="conc-bar-bg"><div class="conc-bar-fill" style="width:' + c.top5Pct + '%;background:var(--accent);"></div></div></div>' +
      '<div class="conc-bar-wrap"><div class="conc-bar-label"><span>Late Bids</span><span>' + c.lateBidPct + '%</span></div><div class="conc-bar-bg"><div class="conc-bar-fill" style="width:' + c.lateBidPct + '%;background:var(--amber);"></div></div></div>' +
      '</div>';
  }

  var flagsHtml = '';
  if (a.flags && a.flags.length > 0) {
    flagsHtml = '<div class="detail-flags">' + a.flags.map(function(f) {
      return '<span class="detail-flag">' + f + '</span>';
    }).join('') + '</div>';
  }

  var linksHtml = '<div class="detail-links">' +
    '<a href="' + uniswapUrl + '" target="_blank">Uniswap App</a>' +
    '<a href="' + explorerUrl + '" target="_blank">Auction Contract</a>' +
    '<a href="' + tokenUrl + '" target="_blank">Token Contract</a>' +
    '</div>';

  return '<div class="detail-panel">' +
    '<div class="detail-grid">' + gridHtml + '</div>' +
    concHtml + flagsHtml + linksHtml +
    '</div>';
}

function renderTable(data) {
  var auctions = showTests ? data.auctions.slice() : data.auctions.filter(function(a) { return !a.isTest; });
  auctions = auctions.filter(matchesFilters);
  var totalBeforeFilter = showTests ? data.auctions.length : data.auctions.filter(function(a) { return !a.isTest; }).length;
  var countEl = document.getElementById('filterCount');
  if (countEl) countEl.textContent = auctions.length < totalBeforeFilter ? '(' + auctions.length + ' of ' + totalBeforeFilter + ')' : '';

  if (sortKey) {
    auctions.sort(function(a, b) {
      var va = getSortValue(a, sortKey);
      var vb = getSortValue(b, sortKey);
      if (va < vb) return sortAsc ? -1 : 1;
      if (va > vb) return sortAsc ? 1 : -1;
      return 0;
    });
  }

  document.querySelectorAll('#thead-row th[data-key]').forEach(function(th) {
    var arrow = th.querySelector('.sort-arrow');
    var key = th.getAttribute('data-key');
    arrow.textContent = sortKey === key ? (sortAsc ? ' ^' : ' v') : '';
  });

  if (auctions.length === 0) {
    document.getElementById('empty').style.display = 'block';
    document.getElementById('tbody').innerHTML = '';
    return;
  }
  document.getElementById('empty').style.display = 'none';

  var colCount = document.querySelectorAll('#thead-row th').length;

  var tbody = document.getElementById('tbody');
  tbody.innerHTML = auctions.map(function(a, idx) {
    var statusBadge = a.graduated
      ? '<span class="badge badge-green">Graduated</span>'
      : '<span class="badge badge-red">Failed</span>';

    var hookBadge = a.hasValidationHook
      ? '<span class="badge badge-green">Yes</span>'
      : '<span class="badge badge-red">No</span>';

    var durationDays = (a.durationHours / 24).toFixed(1);

    var flags = (a.flags || []).map(function(f) {
      var short = f.split(':')[0];
      return '<span class="badge badge-flag">' + short + '</span>';
    }).join(' ');

    var rowClass = a.isTest ? 'test-row data-row' : 'data-row';
    var isExpanded = expandedRow === idx;

    var row = '<tr class="' + rowClass + '" onclick="toggleDetail(' + idx + ')" title="Click to expand">' +
      '<td><strong>' + (a.tokenSymbol || a.name) + '</strong>' + (a.isTest ? ' <span class="badge badge-flag">TEST</span>' : '') + '<br><span class="mono">' + (a.tokenName || '') + '</span></td>' +
      '<td><span class="badge badge-chain">' + a.chain + '</span></td>' +
      '<td>' + statusBadge + '</td>' +
      '<td class="hide-mobile">' + (a.currencySymbol || '?') + '</td>' +
      '<td class="right">' + (a.currencyRaisedFormatted || '\u2014') + '</td>' +
      '<td class="right hide-mobile">' + (a.totalBids != null ? a.totalBids.toLocaleString() : '\u2014') + '</td>' +
      '<td class="right">' + (a.uniqueBidders != null ? a.uniqueBidders.toLocaleString() : '\u2014') + '</td>' +
      '<td class="right hide-mobile">' + durationDays + 'd<br><span class="mono">' + a.durationHours + 'h</span></td>' +
      '<td class="right"><strong>' + (a.clearingVsFloor || '\u2014') + '</strong></td>' +
      '<td class="right hide-mobile">' + (a.concentration ? '<span style="color:' + (a.concentration.hhi < 1500 ? 'var(--green)' : a.concentration.hhi < 2500 ? 'var(--amber)' : 'var(--red)') + '">' + a.concentration.hhi + '</span>' : '\u2014') + '</td>' +
      '<td class="right hide-mobile">' + (a.concentration ? a.concentration.top5Pct + '%' : '\u2014') + '</td>' +
      '<td class="hide-mobile">' + hookBadge + '</td>' +
      '<td class="wrap hide-mobile">' + (flags || '\u2014') + '</td>' +
      '</tr>';

    if (isExpanded) {
      row += '<tr class="detail-row"><td colspan="' + colCount + '">' + buildDetailPanel(a) + '</td></tr>';
    }

    return row;
  }).join('');
}

// ── Export functions ─────────────────────────────────────────────
function exportJSON() {
  if (!allData) return;
  var blob = new Blob([JSON.stringify(allData, null, 2)], { type: 'application/json' });
  downloadBlob(blob, 'cca-monitor-data.json');
}

function exportCSV() {
  if (!allData) return;
  var auctions = allData.auctions;
  var headers = ['Name', 'Chain', 'Status', 'Currency', 'Raised', 'Bids', 'Bidders', 'Duration (h)', 'Clearing/Floor', 'HHI', 'Top-5%', 'Hook', 'Flags', 'Floor Price', 'Clearing Price', 'Contract'];
  var rows = auctions.map(function(a) {
    return [
      a.tokenSymbol || a.name,
      a.chain,
      a.graduated ? 'Graduated' : 'Failed',
      a.currencySymbol || '',
      a.currencyRaisedFormatted || '',
      a.totalBids != null ? a.totalBids : '',
      a.uniqueBidders != null ? a.uniqueBidders : '',
      a.durationHours,
      a.clearingVsFloor || '',
      a.concentration ? a.concentration.hhi : '',
      a.concentration ? a.concentration.top5Pct : '',
      a.hasValidationHook ? 'Yes' : 'No',
      (a.flags || []).join('; '),
      a.floorPrice || '',
      a.clearingPrice || '',
      a.contractAddress,
    ].map(function(v) {
      var s = String(v == null ? '' : v);
      if (s.indexOf(',') >= 0 || s.indexOf('"') >= 0 || s.indexOf('\n') >= 0) {
        return '"' + s.replace(/"/g, '""') + '"';
      }
      return s;
    }).join(',');
  });
  var csv = [headers.join(',')].concat(rows).join('\n');
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  downloadBlob(blob, 'cca-monitor-auctions.csv');
}

function downloadBlob(blob, filename) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

load();
</script>
