<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCA Monitor</title>
<style>
  :root {
    --bg: #0a0e17;
    --surface: #111827;
    --border: #1e293b;
    --text: #e2e8f0;
    --muted: #64748b;
    --accent: #6366f1;
    --green: #22c55e;
    --red: #ef4444;
    --amber: #f59e0b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .header {
    border-bottom: 1px solid var(--border);
    padding: 24px 32px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .header h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
  .header h1 span { color: var(--accent); }
  .header-meta { font-size: 13px; color: var(--muted); }

  .stats-row {
    display: flex; gap: 16px; padding: 24px 32px; flex-wrap: wrap;
  }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px 20px; min-width: 140px; flex: 1;
  }
  .stat-card .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .stat-card .value { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat-card .value.green { color: var(--green); }
  .stat-card .value.amber { color: var(--amber); }
  .stat-card .sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

  .charts-row {
    display: flex; gap: 16px; padding: 0 32px 24px; flex-wrap: wrap;
  }
  .chart-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 20px; flex: 1; min-width: 300px;
  }
  .chart-card h3 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 16px; }
  .bar-chart { display: flex; align-items: flex-end; gap: 12px; height: 160px; padding-top: 8px; }
  .bar-group { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
  .bar-wrapper { display: flex; gap: 4px; align-items: flex-end; width: 100%; justify-content: center; flex: 1; }
  .bar {
    border-radius: 4px 4px 0 0; min-width: 20px; transition: height 0.5s ease;
    position: relative; cursor: default;
  }
  .bar:hover { opacity: 0.85; }
  .bar-label { font-size: 11px; color: var(--muted); text-align: center; white-space: nowrap; }
  .bar-value { font-size: 10px; font-weight: 600; color: var(--text); text-align: center; margin-bottom: 2px; }
  .chart-legend { display: flex; gap: 16px; margin-top: 12px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; }

  .table-wrap { padding: 0 32px 32px; overflow-x: auto; }
  .table-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .table-header h2 { font-size: 15px; font-weight: 600; }
  .toggle-btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--muted);
    padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer;
    transition: all 0.15s;
  }
  .toggle-btn:hover { border-color: var(--accent); color: var(--text); }
  .toggle-btn.active { border-color: var(--accent); color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead th {
    text-align: left; padding: 10px 12px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted);
    border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg);
    cursor: pointer; user-select: none;
  }
  thead th:hover { color: var(--text); }
  thead th .sort-arrow { font-size: 10px; margin-left: 4px; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.15s; }
  tbody tr:hover { background: rgba(99,102,241,0.05); }
  tbody tr.test-row { opacity: 0.5; }
  td { padding: 12px; white-space: nowrap; }
  td.wrap { white-space: normal; max-width: 200px; }

  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 9999px;
    font-size: 11px; font-weight: 600;
  }
  .badge-green { background: rgba(34,197,94,0.15); color: var(--green); }
  .badge-red { background: rgba(239,68,68,0.15); color: var(--red); }
  .badge-chain { background: rgba(99,102,241,0.15); color: var(--accent); }
  .badge-flag { background: rgba(245,158,11,0.12); color: var(--amber); margin: 2px 0; display: inline-block; }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .mono { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px; color: var(--muted); }
  .right { text-align: right; }

  .cta-bar {
    background: linear-gradient(135deg, rgba(99,102,241,0.12), rgba(139,92,246,0.08));
    border: 1px solid rgba(99,102,241,0.25); border-radius: 8px;
    padding: 16px 24px; margin: 0 32px 24px; display: flex;
    align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  .cta-bar .cta-text { font-size: 14px; }
  .cta-bar .cta-text strong { color: #a5b4fc; }
  .cta-btn {
    background: var(--accent); color: white; border: none; padding: 8px 20px;
    border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;
    text-decoration: none; display: inline-block;
  }
  .cta-btn:hover { background: #4f46e5; text-decoration: none; }

  .empty-state { text-align: center; padding: 80px 32px; color: var(--muted); }
  .empty-state h2 { font-size: 18px; margin-bottom: 8px; color: var(--text); }

  @media (max-width: 768px) {
    .header, .stats-row, .table-wrap, .cta-bar, .charts-row { padding-left: 16px; padding-right: 16px; }
    .stats-row { gap: 8px; }
    .stat-card { min-width: 100px; padding: 12px; }
    .stat-card .value { font-size: 20px; }
    .charts-row { flex-direction: column; }
    .chart-card { min-width: unset; }
  }
</style>
</head>
<body>

<div class="header">
  <h1><span>CCA</span> Monitor</h1>
  <div class="header-meta" id="meta">Loading...</div>
</div>

<div class="stats-row" id="stats"></div>

<div class="charts-row" id="charts"></div>

<div class="cta-bar">
  <div class="cta-text">Get <strong>instant alerts</strong> when new auctions deploy, with bid tracking and analysis.</div>
  <a href="https://t.me/cca_auctions" class="cta-btn" target="_blank">Join Telegram Channel</a>
</div>

<div class="table-wrap">
  <div class="table-header">
    <h2>Auctions</h2>
    <button class="toggle-btn" id="testToggle" onclick="toggleTests()">Show test auctions</button>
  </div>
  <table>
    <thead>
      <tr id="thead-row">
        <th data-key="name">Token <span class="sort-arrow"></span></th>
        <th data-key="chain">Chain <span class="sort-arrow"></span></th>
        <th data-key="graduated">Status <span class="sort-arrow"></span></th>
        <th data-key="currencySymbol">Currency <span class="sort-arrow"></span></th>
        <th data-key="raised" class="right">Raised <span class="sort-arrow"></span></th>
        <th data-key="totalBids" class="right">Bids <span class="sort-arrow"></span></th>
        <th data-key="uniqueBidders" class="right">Bidders <span class="sort-arrow"></span></th>
        <th data-key="durationHours" class="right">Duration <span class="sort-arrow"></span></th>
        <th data-key="clearingVsFloor" class="right">Clear/Floor <span class="sort-arrow"></span></th>
        <th data-key="hhi" class="right">HHI <span class="sort-arrow"></span></th>
        <th data-key="top5Pct" class="right">Top-5% <span class="sort-arrow"></span></th>
        <th data-key="hasValidationHook">Hook <span class="sort-arrow"></span></th>
        <th class="wrap">Flags</th>
        <th>Links</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty-state" id="empty" style="display:none">
    <h2>No auctions found</h2>
    <p>Run <code>npm run analyze</code> to pull auction data.</p>
  </div>
</div>

<script>
let allData = null;
let showTests = false;
let sortKey = null;
let sortAsc = true;

async function load() {
  try {
    const urls = [
      'results.json',
      'https://raw.githubusercontent.com/monkrus/cca-monitor/master/data/results.json',
    ];
    let data;
    for (const url of urls) {
      try {
        const resp = await fetch(url);
        if (resp.ok) { data = await resp.json(); break; }
      } catch {}
    }
    if (!data) throw new Error('No data');
    allData = data;
    render(data);
  } catch {
    document.getElementById('empty').style.display = 'block';
  }
}

function toggleTests() {
  showTests = !showTests;
  const btn = document.getElementById('testToggle');
  btn.textContent = showTests ? 'Hide test auctions' : 'Show test auctions';
  btn.classList.toggle('active', showTests);
  if (allData) renderTable(allData);
}

function render(data) {
  const date = new Date(data.timestamp);
  const real = data.auctions.filter(a => !a.isTest);
  document.getElementById('meta').textContent = 'Last updated: ' + date.toLocaleString() + ' | ' + real.length + ' real auctions, ' + data.summary.tests + ' test';

  // Stats
  const s = data.summary;
  const bi = s.bidderInsights || {};
  const statsHtml = [
    { label: 'Real Auctions', value: s.real, cls: '' },
    { label: 'Graduated', value: s.graduated, cls: 'green', sub: 'of ' + s.total + ' total' },
    { label: 'Unique Bidders', value: bi.totalUnique ? bi.totalUnique.toLocaleString() : '?', cls: '', sub: bi.repeatBidders ? bi.repeatBidders + ' repeat (' + bi.recurrenceRate + ')' : '' },
    { label: 'With KYC Hook', value: s.withHooks, cls: '', sub: 'of ' + s.real + ' real' },
  ].map(function(s) {
    return '<div class="stat-card"><div class="label">' + s.label + '</div><div class="value ' + s.cls + '">' + s.value + '</div>' + (s.sub ? '<div class="sub">' + s.sub + '</div>' : '') + '</div>';
  }).join('');
  document.getElementById('stats').innerHTML = statsHtml;

  renderCharts(data);
  renderTable(data);

  // Sortable headers
  document.querySelectorAll('#thead-row th[data-key]').forEach(function(th) {
    th.addEventListener('click', function() {
      var key = th.getAttribute('data-key');
      if (sortKey === key) { sortAsc = !sortAsc; }
      else { sortKey = key; sortAsc = true; }
      renderTable(allData);
    });
  });
}

function renderCharts(data) {
  var real = data.auctions.filter(function(a) { return !a.isTest; });
  if (real.length === 0) return;

  var maxRatio = 0;
  var maxBids = 0;
  real.forEach(function(a) {
    var r = parseFloat(a.clearingVsFloor) || 0;
    if (r > maxRatio) maxRatio = r;
    var b = (a.totalBids || 0);
    var u = (a.uniqueBidders || 0);
    var m = Math.max(b, u);
    if (m > maxBids) maxBids = m;
  });

  // Chart 1: Clearing vs Floor ratio
  var chart1Bars = real.map(function(a) {
    var ratio = parseFloat(a.clearingVsFloor) || 0;
    var h = maxRatio > 0 ? Math.max(4, (ratio / maxRatio) * 140) : 4;
    var label = ratio > 0 ? ratio.toFixed(0) + '%' : 'n/a';
    return '<div class="bar-group">' +
      '<div class="bar-wrapper"><div class="bar" style="height:' + h + 'px;background:var(--accent);width:32px;" title="' + label + '"><div class="bar-value" style="position:absolute;top:-18px;width:100%;text-align:center;">' + label + '</div></div></div>' +
      '<div class="bar-label">' + a.name + '</div></div>';
  }).join('');

  // Chart 2: Bids & Bidders
  var chart2Bars = real.map(function(a) {
    var bids = a.totalBids || 0;
    var bidders = a.uniqueBidders || 0;
    var hBids = maxBids > 0 ? Math.max(4, (bids / maxBids) * 140) : 4;
    var hBidders = maxBids > 0 ? Math.max(4, (bidders / maxBids) * 140) : 4;
    return '<div class="bar-group">' +
      '<div class="bar-wrapper">' +
      '<div class="bar" style="height:' + hBids + 'px;background:var(--accent);width:20px;" title="' + bids.toLocaleString() + ' bids"></div>' +
      '<div class="bar" style="height:' + hBidders + 'px;background:var(--green);width:20px;" title="' + bidders.toLocaleString() + ' bidders"></div>' +
      '</div>' +
      '<div class="bar-label">' + a.name + '</div></div>';
  }).join('');

  // Chart 3: Concentration (HHI & Late-bid %)
  var concAuctions = real.filter(function(a) { return a.concentration; });
  var chart3Html = '';
  if (concAuctions.length > 0) {
    var maxHhi = 10000; // HHI max is always 10000
    var chart3Bars = concAuctions.map(function(a) {
      var c = a.concentration;
      var hHhi = Math.max(4, (c.hhi / maxHhi) * 140);
      var hLate = Math.max(4, (c.lateBidPct / 100) * 140);
      var hhiColor = c.hhi < 1500 ? 'var(--green)' : c.hhi < 2500 ? 'var(--amber)' : 'var(--red)';
      return '<div class="bar-group">' +
        '<div class="bar-wrapper">' +
        '<div class="bar" style="height:' + hHhi + 'px;background:' + hhiColor + ';width:20px;" title="HHI: ' + c.hhi + (c.effectiveCompetition ? ' (competitive)' : ' (concentrated)') + '"><div class="bar-value" style="position:absolute;top:-18px;width:100%;text-align:center;">' + c.hhi + '</div></div>' +
        '<div class="bar" style="height:' + hLate + 'px;background:var(--accent);width:20px;" title="Late bids: ' + c.lateBidPct + '%"></div>' +
        '</div>' +
        '<div class="bar-label">' + a.name + '</div></div>';
    }).join('');
    chart3Html = '<div class="chart-card"><h3>Concentration & Late Bids</h3><div class="bar-chart" style="position:relative;">' + chart3Bars + '</div>' +
      '<div class="chart-legend">' +
      '<div class="legend-item"><div class="legend-dot" style="background:var(--green);"></div>HHI &lt;1500</div>' +
      '<div class="legend-item"><div class="legend-dot" style="background:var(--amber);"></div>HHI 1500-2500</div>' +
      '<div class="legend-item"><div class="legend-dot" style="background:var(--red);"></div>HHI &gt;2500</div>' +
      '<div class="legend-item"><div class="legend-dot" style="background:var(--accent);"></div>Late-bid %</div>' +
      '</div></div>';
  }

  document.getElementById('charts').innerHTML =
    '<div class="chart-card"><h3>Clearing vs Floor Price</h3><div class="bar-chart" style="position:relative;">' + chart1Bars + '</div></div>' +
    '<div class="chart-card"><h3>Bids & Unique Bidders</h3><div class="bar-chart" style="position:relative;">' + chart2Bars + '</div>' +
    '<div class="chart-legend"><div class="legend-item"><div class="legend-dot" style="background:var(--accent);"></div>Total bids</div><div class="legend-item"><div class="legend-dot" style="background:var(--green);"></div>Unique bidders</div></div></div>' +
    chart3Html;
}

function parseRaised(a) {
  if (!a.currencyRaisedFormatted) return 0;
  return parseFloat(a.currencyRaisedFormatted.replace(/[^0-9.]/g, '')) || 0;
}

function getSortValue(a, key) {
  switch(key) {
    case 'name': return (a.tokenSymbol || a.name || '').toLowerCase();
    case 'chain': return a.chain;
    case 'graduated': return a.graduated ? 1 : 0;
    case 'currencySymbol': return a.currencySymbol || '';
    case 'raised': return parseRaised(a);
    case 'totalBids': return a.totalBids || 0;
    case 'uniqueBidders': return a.uniqueBidders || 0;
    case 'durationHours': return a.durationHours || 0;
    case 'clearingVsFloor': return parseFloat(a.clearingVsFloor) || 0;
    case 'hhi': return a.concentration ? a.concentration.hhi : -1;
    case 'top5Pct': return a.concentration ? a.concentration.top5Pct : -1;
    case 'hasValidationHook': return a.hasValidationHook ? 1 : 0;
    default: return '';
  }
}

function renderTable(data) {
  var auctions = showTests ? data.auctions.slice() : data.auctions.filter(function(a) { return !a.isTest; });

  if (sortKey) {
    auctions.sort(function(a, b) {
      var va = getSortValue(a, sortKey);
      var vb = getSortValue(b, sortKey);
      if (va < vb) return sortAsc ? -1 : 1;
      if (va > vb) return sortAsc ? 1 : -1;
      return 0;
    });
  }

  // Update sort arrows
  document.querySelectorAll('#thead-row th[data-key]').forEach(function(th) {
    var arrow = th.querySelector('.sort-arrow');
    var key = th.getAttribute('data-key');
    arrow.textContent = sortKey === key ? (sortAsc ? ' ^' : ' v') : '';
  });

  if (auctions.length === 0) {
    document.getElementById('empty').style.display = 'block';
    document.getElementById('tbody').innerHTML = '';
    return;
  }
  document.getElementById('empty').style.display = 'none';

  var tbody = document.getElementById('tbody');
  tbody.innerHTML = auctions.map(function(a) {
    var chainSlug = a.chain === 'mainnet' ? 'ethereum' : a.chain;
    var explorerBase = {
      mainnet: 'https://etherscan.io',
      base: 'https://basescan.org',
      arbitrum: 'https://arbiscan.io',
      unichain: 'https://uniscan.xyz',
    }[a.chain] || '';
    var uniswapUrl = 'https://app.uniswap.org/explore/auctions/' + chainSlug + '/' + a.tokenAddress;
    var explorerUrl = explorerBase + '/address/' + a.tokenAddress;

    var statusBadge = a.graduated
      ? '<span class="badge badge-green">Graduated</span>'
      : '<span class="badge badge-red">Failed</span>';

    var hookBadge = a.hasValidationHook
      ? '<span class="badge badge-green">Yes</span>'
      : '<span class="badge badge-red">No</span>';

    var durationDays = (a.durationHours / 24).toFixed(1);

    var flags = (a.flags || []).map(function(f) {
      var short = f.split(':')[0];
      return '<span class="badge badge-flag">' + short + '</span>';
    }).join(' ');

    var rowClass = a.isTest ? ' class="test-row"' : '';

    return '<tr' + rowClass + '>' +
      '<td><strong>' + (a.tokenSymbol || a.name) + '</strong>' + (a.isTest ? ' <span class="badge badge-flag">TEST</span>' : '') + '<br><span class="mono">' + (a.tokenName || '') + '</span></td>' +
      '<td><span class="badge badge-chain">' + a.chain + '</span></td>' +
      '<td>' + statusBadge + '</td>' +
      '<td>' + (a.currencySymbol || '?') + '</td>' +
      '<td class="right">' + (a.currencyRaisedFormatted || '—') + '</td>' +
      '<td class="right">' + (a.totalBids != null ? a.totalBids.toLocaleString() : '—') + '</td>' +
      '<td class="right">' + (a.uniqueBidders != null ? a.uniqueBidders.toLocaleString() : '—') + '</td>' +
      '<td class="right">' + durationDays + 'd<br><span class="mono">' + a.durationHours + 'h</span></td>' +
      '<td class="right"><strong>' + (a.clearingVsFloor || '—') + '</strong></td>' +
      '<td class="right">' + (a.concentration ? '<span style="color:' + (a.concentration.hhi < 1500 ? 'var(--green)' : a.concentration.hhi < 2500 ? 'var(--amber)' : 'var(--red)') + '">' + a.concentration.hhi + '</span>' : '—') + '</td>' +
      '<td class="right">' + (a.concentration ? a.concentration.top5Pct + '%' : '—') + '</td>' +
      '<td>' + hookBadge + '</td>' +
      '<td class="wrap">' + (flags || '—') + '</td>' +
      '<td><a href="' + uniswapUrl + '" target="_blank">Uniswap</a> | <a href="' + explorerUrl + '" target="_blank">Explorer</a></td>' +
      '</tr>';
  }).join('');
}

load();
</script>
</body>
</html>
