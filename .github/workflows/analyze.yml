name: Weekly Analyze & Deploy

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6 UTC
  workflow_dispatch:       # Manual trigger from Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: analyze
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      - name: Run analyze (real auctions only)
        env:
          RPC_URL_MAINNET: ${{ secrets.RPC_URL_MAINNET }}
          RPC_URL_BASE: ${{ secrets.RPC_URL_BASE }}
        run: npx tsx cca-collector.ts analyze --real-only

      - name: Verify data integrity
        run: npx tsx verify-data.ts

      - name: Check for data changes
        id: changes
        run: |
          if git diff --quiet data/results.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/results.json data/bidder-index.json data/invariants.json
          git commit -m "Data: weekly analyze refresh"
          git push

      - name: Deploy dashboard
        if: steps.changes.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
        with:
          artifact: false

  deploy:
    needs: analyze
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Pull latest (in case analyze committed)
        run: git pull origin master
      - name: Copy results.json to public/
        run: cp data/results.json public/results.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
