name = "cca-monitor-api"
main = "worker.js"
compatibility_date = "2024-01-01"

# Deploy: cd api && npx wrangler deploy
# Dev:    cd api && npx wrangler dev
# Free tier: 100K requests/day (Cloudflare)

# Secrets (set via wrangler secret):
#   npx wrangler secret put API_KEYS        — comma-separated pro API keys
#   npx wrangler secret put PAYMENT_ADDRESS  — 0x wallet address for USDC payments

# ─── Usage metering KV ────────────────────────────────────────────
# Create the namespace first:
#   npx wrangler kv:namespace create USAGE
# Then paste the returned ID below.
#
# For preview/dev:
#   npx wrangler kv:namespace create USAGE --preview
#
# [[kv_namespaces]]
# binding = "USAGE"
# id = "<paste-namespace-id-here>"
# preview_id = "<paste-preview-id-here>"

[triggers]
crons = []
